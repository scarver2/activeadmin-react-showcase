# config/cable.yml

development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: <%= ENV["SOLID_CABLE_IN_TEST"] == "1" ? "solid_cable" : "test" %>
  connects_to:
    database:
      writing: cable
  polling_interval: 0.05.seconds
  message_retention: 1.day

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
